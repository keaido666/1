<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
<script>LA.init({id:"3Q0l4DjVwMLAHrrY",ck:"3Q0l4DjVwMLAHrrY"})</script>
    <title>帮会KPI统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }
        body {
            background-color: #ebebe7;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: #f8f7f4;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #ffffff;
            padding: 24px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            position: relative;
        }
        .header-images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .header-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #fff;
            object-fit: cover;
        }
        .tool-wrap { padding: 30px; }

        .money-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .money-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .file-input {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
        }

        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 350px; }
        .col-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
        textarea {
            width: 100%;
            height: 380px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; background: #91aecf; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: #7a96b7; }
        .btn.danger { background: #c95d56; }
        .btn.success { background: #5ba369; }
        .btn.purple { background: #8a71c1; }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #fff;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .result-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .result-item:hover {
            background: #f7f9fc;
        }
        .result-item .rank {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }
        .result-item .name {
            flex: 1;
            padding: 0 10px;
            color: #333;
            font-weight: 500;
        }
        .result-item .count {
            width: 100px;
            text-align: right;
            color: #b94539;
            font-weight: bold;
        }

        /* 前10名高亮强化样式 */
        .result-item.top1 { background: #ffefb0; border-left: 4px solid #ffb100; font-weight: bold; }
        .result-item.top2 { background: #e4f8e7; border-left: 4px solid #2ecc71; font-weight: bold; }
        .result-item.top3 { background: #e7f2ff; border-left: 4px solid #3498db; font-weight: bold; }
        .result-item.top4-10 { background: #f9f3ff; border-left: 4px solid #9b59b6; }
        
        .total-info {
            margin-top: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .float-menu {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 999;
            width: 220px;
            transition: all 0.3s ease;
        }
        .float-menu.collapsed {
            transform: translateY(-50%) translateX(calc(100% - 25px));
        }
        .menu-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 60px;
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            border-radius: 12px 0 0 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px; cursor: pointer;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1); user-select: none;
        }
        .menu-content {
            width: 170px; background: #fff; margin-left: 25px;
            border-radius: 12px 0 0 12px;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.1); overflow: hidden;
        }
        .menu-header {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff; padding: 14px 16px;
            font-weight: bold; text-align: center; font-size: 15px;
        }
        .menu-list { list-style: none; padding: 8px 0; }
        .menu-link {
            display: block; padding: 12px 18px; color: #333;
            text-decoration: none; font-size: 14px; transition: all 0.2s;
        }
        .menu-link:hover { background: #f0f4fa; color: #91aecf; }
        .menu-link.active {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff; font-weight: bold; border-left: 4px solid #fff;
        }
    </style>
</head>
<body>

<div class="float-menu collapsed" id="floatMenu">
    <div class="menu-toggle" id="menuToggle"><span>≡</span></div>
    <div class="menu-content">
        <div class="menu-header">完美国服</div>
        <ul class="menu-list">
            <li><a href="https://keaido666.github.io/1/ch.html" class="menu-link">永久称号大全</a></li>
            <li><a href="https://keaido666.github.io/1/dy.html" class="menu-link">丹药生产</a></li>
            <li><a href="https://keaido666.github.io/1/ys.html" class="menu-link">时装颜色识别</a></li>
            <li><a href="https://keaido666.github.io/1/bh.html" class="menu-link">帮会统计</a></li>
            <li><a href="#" class="menu-link active">帮会KPI</a></li>
        </ul>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="header-images">
            <img src="https://keaido666.github.io/1/keai1.jpg" class="header-avatar">
            <img src="https://keaido666.github.io/1/keavx.png" class="header-avatar">
        </div>
        抖音：可爱多完美<br>
        帮会KPI统计（参与次数）
    </div>

    <div class="tool-wrap">
        <div class="money-box">
            <div class="money-left">
                <input type="file" id="excelFile" class="file-input" accept=".xls,.xlsx">
                <button class="btn danger" id="clearFileBtn">清空Excel</button>
                <button class="btn" id="calcBtn">开始统计</button>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn success" id="copyBtn">复制结果</button>
                <button class="btn purple" id="saveImgBtn">保存为图片</button>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="col-title">
                    <span>粘贴人员名单（一行一个名字）</span>
                </div>
                <textarea id="nameArea" placeholder="直接粘贴所有参与记录，一行一个名字，支持超大数量..."></textarea>
                <div class="btn-group">
                    <button class="btn danger" id="clearBtn">清空内容</button>
                </div>
            </div>
        </div>

        <div class="total-info" id="totalInfo"></div>
        <div class="result-box" id="resultBox"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// 菜单
const floatMenu = document.getElementById('floatMenu');
document.getElementById('menuToggle').onclick = () => floatMenu.classList.toggle('collapsed');

// 清理名字（忽略符号）
function cleanName(str) {
    if (!str) return '';
    let s = str.trim();
    s = s.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
    return s.toLowerCase();
}

// 统计次数 + 正确并列排名
document.getElementById('calcBtn').onclick = () => {
    const text = document.getElementById('nameArea').value;
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    
    const countMap = {};
    const originalMap = {};

    lines.forEach(line => {
        const key = cleanName(line);
        if (!key) return;
        countMap[key] = (countMap[key] || 0) + 1;
        if (!originalMap[key]) originalMap[key] = line;
    });

    // 排序：次数从高到低
    const sorted = Object.entries(countMap).sort((a, b) => b[1] - a[1]);
    if (sorted.length === 0) {
        document.getElementById('resultBox').innerHTML = '';
        document.getElementById('totalInfo').textContent = '无数据';
        return;
    }

    // 正确竞赛排名：1,1,1,2,2,3
    const ranks = [];
    let currentRank = 1;
    let prevCount = sorted[0][1];
    ranks.push(currentRank);

    for (let i = 1; i < sorted.length; i++) {
        if (sorted[i][1] !== prevCount) {
            prevCount = sorted[i][1];
            currentRank = ranks[i-1] + 1;
        }
        ranks.push(currentRank);
    }

    // 渲染：相同排名只显示一次
    const box = document.getElementById('resultBox');
    box.innerHTML = '';
    let lastShowRank = -1;

    sorted.forEach(([key, count], i) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const rk = ranks[i];

        // 高亮
        if (rk === 1) div.classList.add('top1');
        else if (rk === 2) div.classList.add('top2');
        else if (rk === 3) div.classList.add('top3');
        else if (rk <= 10) div.classList.add('top4-10');

        // 只显示第一次出现的排名
        const rankText = lastShowRank !== rk ? `第${rk}名` : '';
        lastShowRank = rk;

        div.innerHTML = `
            <span class="rank">${rankText}</span>
            <span class="name">${originalMap[key]}</span>
            <span class="count">${count} 次</span>
        `;
        box.appendChild(div);
    });

    document.getElementById('totalInfo').textContent =
        `总记录数：${lines.length} 条 | 有效人数：${sorted.length} 人`;
};

// 清空文本
document.getElementById('clearBtn').onclick = () => {
    document.getElementById('nameArea').value = '';
    document.getElementById('resultBox').innerHTML = '';
    document.getElementById('totalInfo').textContent = '';
};

// 清空Excel上传
document.getElementById('clearFileBtn').onclick = () => {
    document.getElementById('excelFile').value = '';
    alert('已清空上传的Excel文件');
};

// 复制结果
document.getElementById('copyBtn').onclick = () => {
    const items = document.querySelectorAll('.result-item');
    let text = '';
    items.forEach(i => {
        const rk = i.querySelector('.rank').textContent || '　';
        const name = i.querySelector('.name').textContent;
        const cnt = i.querySelector('.count').textContent;
        text += `${rk} ${name}：${cnt}\n`;
    });
    navigator.clipboard.writeText(text).then(() => {
        alert('复制成功！');
    });
};

// 保存图片（支持自选保存位置）
document.getElementById('saveImgBtn').onclick = async () => {
    const res = document.getElementById('resultBox');
    const info = document.getElementById('totalInfo');
    if(!res.innerHTML || !info.textContent){
        alert('请先统计数据！');
        return;
    }

    try {
        // 生成高清图片
        const wrap = document.createElement('div');
        wrap.style.background = '#fff';
        wrap.style.padding = '16px';
        wrap.style.width = '550px';
        
        const infoEl = document.createElement('div');
        infoEl.style.fontSize = '15px';
        infoEl.style.fontWeight = 'bold';
        infoEl.style.marginBottom = '10px';
        infoEl.textContent = info.textContent;
        wrap.appendChild(infoEl);
        
        const clone = res.cloneNode(true);
        clone.style.maxHeight = 'none';
        clone.style.overflow = 'visible';
        wrap.appendChild(clone);
        document.body.appendChild(wrap);

        const canvas = await html2canvas(wrap, { scale: 2, useCORS: true });
        document.body.removeChild(wrap);

        // 转换为文件
        canvas.toBlob(async (blob) => {
            // 打开系统保存对话框（自选位置）
            const handle = await window.showSaveFilePicker({
                suggestedName: '帮会KPI排行榜.png',
                types: [{
                    description: 'PNG图片',
                    accept: { 'image/png': ['.png'] }
                }]
            });

            // 写入文件
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            alert('图片已保存到你选择的位置！');
        }, 'image/png');
    } catch (err) {
        alert('保存已取消或失败');
    }
};

// 上传Excel —— 读取所有工作表
document.getElementById('excelFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const data = new Uint8Array(ev.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            let names = [];
            wb.SheetNames.forEach(sheetName => {
                const ws = wb.Sheets[sheetName];
                const arr = XLSX.utils.sheet_to_json(ws, { header: 1 });
                arr.forEach(row => {
                    row.forEach(cell => {
                        if (cell && String(cell).trim()) {
                            names.push(String(cell).trim());
                        }
                    });
                });
            });
            document.getElementById('nameArea').value = names.join('\n');
            alert(`读取成功！共加载 ${names.length} 条记录（全工作表）`);
        } catch (err) {
            alert('读取失败，请检查文件');
        }
    };
    reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
