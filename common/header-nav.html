//自动高亮当前页面导航active
(function setNavActive(){
    const pageName = location.pathname.split('/').pop();
    document.querySelectorAll('.menu-link').forEach(a=>{
        const href = a.getAttribute('href');
        if(href.endsWith(pageName)){
            a.classList.add('active');
        }
    })
})();
</script>
