<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
<script>LA.init({id:"3Q0kmraBY4FcSg4B",ck:"3Q0kmraBY4FcSg4B"})</script>
    <title>完美世界 帮会打野活动统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }
        body {
            background-color: #ebebe7;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: #f8f7f4;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #ffffff;
            padding: 24px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            position: relative;
        }
         .header-images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .header-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #fff;
            object-fit: cover;
        }
        .tool-wrap { padding: 30px; }

        /* 金额选择区 */
        .money-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .money-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .money-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .money-item label {
            font-size: 14px;
            font-weight: bold;
        }
        .money-item input {
            width: 180px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 350px; }
        .col-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
        textarea { width: 100%; height: 300px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 16px; background: #91aecf; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: #7a96b7; }
        .btn.danger { background: #c95d56; }
        .result-box { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; }
        .result-item { margin: 8px 0; font-size: 15px; color: #333; }
        .duplicate-item { color: #888; margin: 4px 0; font-size: 14px; }
        .money-result { font-size: 15px; color: #b94539; font-weight: bold; margin: 8px 0; }

        .float-menu {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 999;
            width: 220px;
            transition: all 0.3s ease;
        }
        .float-menu.collapsed {
            transform: translateY(-50%) translateX(calc(100% - 25px));
        }
        .menu-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 60px;
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            border-radius: 12px 0 0 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px; cursor: pointer;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1); user-select: none;
        }
        .menu-content {
            width: 170px; background: #fff; margin-left: 25px;
            border-radius: 12px 0 0 12px;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.1); overflow: hidden;
        }
        .menu-header {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff; padding: 14px 16px;
            font-weight: bold; text-align: center; font-size: 15px;
        }
        .menu-list { list-style: none; padding: 8px 0; }
        .menu-link {
            display: block; padding: 12px 18px; color: #333;
            text-decoration: none; font-size: 14px; transition: all 0.2s;
        }
        .menu-link:hover { background: #f0f4fa; color: #91aecf; }
        .menu-link.active {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff; font-weight: bold; border-left: 4px solid #fff;
        }
    </style>
</head>
<body>

<div class="float-menu collapsed" id="floatMenu">
    <div class="menu-toggle" id="menuToggle"><span>≡</span></div>
    <div class="menu-content">
        <div class="menu-header">完美国服</div>
        <ul class="menu-list">
            <li><a href="https://keaido666.github.io/1/ch.html" class="menu-link">永久称号大全</a></li>
            <li><a href="https://keaido666.github.io/1/dy.html" class="menu-link">丹药生产</a></li>
            <li><a href="https://keaido666.github.io/1/ys.html" class="menu-link">时装颜色识别</a></li>
            <li><a href="https://keaido666.github.io/1/bh.html" class="menu-link active">帮会统计</a></li>
            <li> <a href="https://keaido666.github.io/1/1.html" class="menu-link">国际</a></li>
        </ul>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="header-images">
            <img src="https://keaido666.github.io/1/keai1.jpg" class="header-avatar">
            <img src="https://keaido666.github.io/1/keavx.png" class="header-avatar">
        </div>
        抖音：可爱多完美<br>
        帮会打野活动统计
    </div>

    <div class="tool-wrap">
        <!-- 金额二选一 + 帮会KPI按钮 -->
        <div class="money-box">
            <div class="money-left">
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" name="moneyType" id="totalType" checked>
                        <label for="totalType">按总金额分配</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" name="moneyType" id="perType">
                        <label for="perType">按每人金额分配</label>
                    </div>
                </div>
                <div class="money-item">
                    <label id="moneyLabel">筹备总金额（金币）</label>
                    <input type="number" id="moneyInput" placeholder="填写金额">
                </div>
            </div>
            <!-- 帮会KPI 按钮 -->
            <button class="btn" onclick="window.open('https://keaido666.github.io/1/bhtj.html','_blank')">帮会KPI</button>
        </div>

        <div class="row">
            <div class="col">
                <div class="col-title">
                    <span>参加活动人员</span><span id="leftCount">0</span>
                </div>
                <textarea id="leftArea"></textarea>
                <div class="btn-group">
                    <button class="btn" id="dedupeBtn">去重</button>
                    <button class="btn danger" id="clearLeftBtn">清空</button>
                </div>
            </div>

            <div class="col">
                <div class="col-title">
                    <span>帮派人员表</span><span id="rightCount">0</span>
                </div>
                <textarea id="rightArea"></textarea>
                <div class="btn-group">
                    <button class="btn" id="matchBtn">匹配</button>
                </div>
            </div>
        </div>

        <div class="result-box">
            <div class="duplicate-item" id="duplicateTips"></div>
            <div class="result-item" id="unmatchLeft"></div>
            <div class="result-item" id="matchRight"></div>
            <div class="money-result" id="moneyResult"></div>
        </div>
    </div>
</div>

<script>
// 菜单
const floatMenu = document.getElementById('floatMenu');
document.getElementById('menuToggle').onclick = () => floatMenu.classList.toggle('collapsed');

// 金额类型切换
const totalType = document.getElementById('totalType');
const perType = document.getElementById('perType');
const moneyLabel = document.getElementById('moneyLabel');
const moneyInput = document.getElementById('moneyInput');

totalType.addEventListener('change', () => {
    moneyLabel.textContent = '筹备总金额（金币）';
    moneyInput.placeholder = '填写总金额';
    moneyInput.value = '';
});
perType.addEventListener('change', () => {
    moneyLabel.textContent = '每人分配金额（金币）';
    moneyInput.placeholder = '填写每人金额';
    moneyInput.value = '';
});

// ==============================================
// 核心1：清理名字（去掉所有符号）
// ==============================================
function cleanName(str) {
    if (!str) return '';
    let s = str.trim();
    s = s.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
    return s;
}

// ==============================================
// 核心2：相似度计算（≥65% 匹配成功）
// ==============================================
function getSimilarity(a, b) {
    a = a.toLowerCase();
    b = b.toLowerCase();
    const len = Math.max(a.length, b.length);
    if (len === 0) return 100;
    let same = 0;
    for (let c of a) if (b.includes(c)) same++;
    return (same / len) * 100;
}

// ==============================================
// 去重（忽略符号）
// ==============================================
document.getElementById('dedupeBtn').onclick = () => {
    const area = document.getElementById('leftArea');
    const lines = area.value.split('\n').map(line => line.trim()).filter(Boolean);
    
    const keyCount = {};
    const keyMap = {};
    const res = [];
    const dupTexts = [];

    lines.forEach(line => {
        const key = cleanName(line);
        keyCount[key] = (keyCount[key] || 0) + 1;
        if (!keyMap[key]) keyMap[key] = line;
    });

    const addedKeys = new Set();
    lines.forEach(line => {
        const key = cleanName(line);
        if (!addedKeys.has(key)) {
            addedKeys.add(key);
            res.push(line);
        }
    });

    for (const key in keyCount) {
        if (keyCount[key] > 1) {
            dupTexts.push(`${keyMap[key]}(${keyCount[key]}次)`);
        }
    }

    area.value = res.join('\n');
    updateLeftCount();
    const tips = document.getElementById('duplicateTips');
    tips.textContent = dupTexts.length ? `去重剔除：${dupTexts.join('、')}` : '去重剔除：无重复';
};

// ==============================================
// 匹配（相似度≥65% 即成功 + 忽略符号）
// ==============================================
document.getElementById('matchBtn').onclick = () => {
    const L = document.getElementById('leftArea').value.split('\n').map(line => line.trim()).filter(Boolean);
    const R = document.getElementById('rightArea').value.split('\n').map(line => line.trim()).filter(Boolean);
    
    const matched = [];
    const unmatched = [];
    const used = new Array(R.length).fill(false);

    L.forEach(a => {
        let ok = false;
        const pureA = cleanName(a);
        for (let i = 0; i < R.length; i++) {
            if (used[i]) continue;
            const pureB = cleanName(R[i]);
            const sim = getSimilarity(pureA, pureB);
            if (sim >= 65) {
                used[i] = true;
                matched.push(R[i]);
                ok = true;
                break;
            }
        }
        if (!ok) unmatched.push(a);
    });

    const rightArea = document.getElementById('rightArea');
    rightArea.value = matched.join('\n');
    updateRightCount();

    document.getElementById('unmatchLeft').textContent = `未匹配：${unmatched.length}人 → ${unmatched.join('、') || '无'}`;
    document.getElementById('matchRight').textContent = `匹配成功：${matched.length}人`;

    // 金额智能计算
    const val = +moneyInput.value || 0;
    const num = matched.length;
    let resultText = '';

    if (totalType.checked) {
        const perMoney = num > 0 ? (val / num).toFixed(2) : 0;
        resultText = `总金额：${val}金币 | 人数：${num}人 | 每人可分：${perMoney}金币`;
    } else {
        const totalMoney = val * num;
        resultText = `每人：${val}金币 | 人数：${num}人 | 总发放：${totalMoney}金币`;
    }

    document.getElementById('moneyResult').textContent = resultText;
};

// 计数 + 清空
const leftArea = document.getElementById('leftArea');
const rightArea = document.getElementById('rightArea');
const leftCount = document.getElementById('leftCount');
const rightCount = document.getElementById('rightCount');

function updateLeftCount() {
    leftCount.textContent = leftArea.value.split('\n').map(line => line.trim()).filter(Boolean).length;
}
function updateRightCount() {
    rightCount.textContent = rightArea.value.split('\n').map(line => line.trim()).filter(Boolean).length;
}

leftArea.addEventListener('input', updateLeftCount);
rightArea.addEventListener('input', updateRightCount);

document.getElementById('clearLeftBtn').onclick = () => {
    leftArea.value = '';
    updateLeftCount();
    document.getElementById('duplicateTips').textContent = '';
};

updateLeftCount();
updateRightCount();
</script>
</body>
</html>
