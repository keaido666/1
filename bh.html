<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完美世界 帮会统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }
        body {
            background-color: #ebebe7;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: #f8f7f4;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #ffffff;
            padding: 24px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }
        .header-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #fff;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .tool-wrap { padding: 30px; }

        /* 金额输入区 */
        .money-box {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .money-item {
            flex: 1;
            min-width: 200px;
        }
        .money-item label {
            font-size: 14px;
            font-weight: bold;
            margin-right: 8px;
        }
        .money-item input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 350px; }
        .col-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
        textarea { width: 100%; height: 300px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 16px; background: #91aecf; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: #7a96b7; }
        .btn.danger { background: #c95d56; }
        .result-box { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; }
        .result-item { margin: 8px 0; font-size: 15px; color: #333; }
        .duplicate-item { color: #888; margin: 4px 0; font-size: 14px; }
        .money-result { font-size: 15px; color: #b94539; font-weight: bold; margin: 8px 0; }

        /* 右侧浮动导航 */
        .float-menu {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 999;
            width: 220px;
            transition: all 0.3s ease;
        }
        .float-menu.collapsed {
            transform: translateY(-50%) translateX(calc(100% - 25px));
        }
        .menu-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 60px;
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            border-radius: 12px 0 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            user-select: none;
        }
        .menu-content {
            width: 170px;
            background: #fff;
            margin-left: 25px;
            border-radius: 12px 0 0 12px;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .menu-header {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff;
            padding: 14px 16px;
            font-weight: bold;
            text-align: center;
            font-size: 15px;
        }
        .menu-list {
            list-style: none;
            padding: 8px 0;
        }
        .menu-link {
            display: block;
            padding: 12px 18px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .menu-link:hover {
            background: #f0f4fa;
            color: #91aecf;
        }
        .menu-link.active {
            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff;
            font-weight: bold;
            border-left: 4px solid #fff;
        }
    </style>
</head>
<body>

<!-- 右侧悬浮导航菜单 -->
<div class="float-menu collapsed" id="floatMenu">
    <div class="menu-toggle" id="menuToggle">
        <span>≡</span>
    </div>
    <div class="menu-content">
        <div class="menu-header">完美国服</div>
        <ul class="menu-list">
            <li class="menu-item">
                <a href="https://keaido666.github.io/1/ch.html" class="menu-link">永久称号大全</a>
            </li>
            <li class="menu-item">
                <a href="https://keaido666.github.io/1/dy.html" class="menu-link">丹药生产</a>
            </li>
            <li class="menu-item">
                <a href="https://keaido666.github.io/1/ys.html" class="menu-link">时装颜色识别</a>
            </li>
            <li class="menu-item">
                <a href="https://keaido666.github.io/1/bh.html" class="menu-link active">帮会统计</a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link">页面5（待填）</a>
            </li>
        </ul>
    </div>
</div>

<div class="container">
    <div class="header">
        <img src="https://keaido666.github.io/1/keai1.jpg" class="header-avatar"><br>
        抖音：可爱多完美<br>
        帮会活动统计
    </div>

    <div class="tool-wrap">
        <!-- 金额输入 -->
        <div class="money-box">
            <div class="money-item">
                <label>筹备总金额（金币）</label>
                <input type="number" id="totalMoney" placeholder="填写总金额">
            </div>
            <div class="money-item">
                <label>每人分配金额</label>
                <input type="number" id="perMoney" placeholder="填写每人金额">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="col-title">
                    <span>参加活动人员</span>
                    <span id="leftCount">0</span>
                </div>
                <textarea id="leftArea"></textarea>
                <div class="btn-group">
                    <button class="btn" id="dedupeBtn">去重</button>
                    <button class="btn danger" id="clearLeftBtn">清空</button>
                </div>
            </div>

            <div class="col">
                <div class="col-title">
                    <span>帮派人员表</span>
                    <span id="rightCount">0</span>
                </div>
                <textarea id="rightArea"></textarea>
                <div class="btn-group">
                    <button class="btn" id="matchBtn">匹配</button>
                </div>
            </div>
        </div>

        <div class="result-box">
            <div class="duplicate-item" id="duplicateTips"></div>
            <div class="result-item" id="unmatchLeft"></div>
            <div class="result-item" id="matchRight"></div>
            <div class="money-result" id="moneyResult"></div>
        </div>
    </div>
</div>

<script>
// 右侧菜单展开/收起
const floatMenu = document.getElementById('floatMenu');
const menuToggle = document.getElementById('menuToggle');
menuToggle.addEventListener('click', () => {
    floatMenu.classList.toggle('collapsed');
});

// ===================== 核心过滤：只留中文 =====================
function pureName(s) {
    return s.trim().replace(/[^\u4e00-\u9fa5]/g, '');
}

// ===================== 字符串相似度（60% 即匹配）=====================
function getSimilarity(a, b) {
    let len = Math.max(a.length, b.length);
    if (len === 0) return 1;
    let same = 0;
    for (let c of a) {
        if (b.includes(c)) same++;
    }
    return same / len;
}

// ===================== 匹配规则：≥60% 相同 就成功！=====================
function isMatch(a, b) {
    const pa = pureName(a);
    const pb = pureName(b);
    const sim = getSimilarity(pa, pb);
    return sim >= 0.6;
}

// ===================== 元素获取 =====================
const leftArea = document.getElementById('leftArea');
const rightArea = document.getElementById('rightArea');
const leftCount = document.getElementById('leftCount');
const rightCount = document.getElementById('rightCount');
const dedupeBtn = document.getElementById('dedupeBtn');
const clearLeftBtn = document.getElementById('clearLeftBtn');
const matchBtn = document.getElementById('matchBtn');
const unmatchLeft = document.getElementById('unmatchLeft');
const matchRight = document.getElementById('matchRight');
const duplicateTips = document.getElementById('duplicateTips');
const totalMoney = document.getElementById('totalMoney');
const perMoney = document.getElementById('perMoney');
const moneyResult = document.getElementById('moneyResult');

// 计数
function updateLeftCount() {
    let n = leftArea.value.split('\n').filter(x => x.trim()).length;
    leftCount.textContent = n;
}
function updateRightCount() {
    let n = rightArea.value.split('\n').filter(x => x.trim()).length;
    rightCount.textContent = n;
}

leftArea.addEventListener('input', updateLeftCount);
rightArea.addEventListener('input', updateRightCount);

// ===================== 去重（显示重复项） =====================
dedupeBtn.onclick = () => {
    let lines = leftArea.value.split('\n').map(x => x.trim()).filter(x => x);
    let pureArr = [];
    let result = [];
    let duplicates = [];

    lines.forEach(line => {
        let p = pureName(line);
        if (!pureArr.includes(p)) {
            pureArr.push(p);
            result.push(line);
        } else {
            duplicates.push(line);
        }
    });

    leftArea.value = result.join('\n');
    updateLeftCount();

    if (duplicates.length > 0) {
        duplicateTips.textContent = `去重剔除：${duplicates.join('、')}`;
    } else {
        duplicateTips.textContent = '去重剔除：无重复';
    }
};

// 清空
clearLeftBtn.onclick = () => {
    leftArea.value = '';
    updateLeftCount();
    duplicateTips.textContent = '';
};

// ===================== 匹配 + 金额统计 =====================
matchBtn.onclick = () => {
    let L = leftArea.value.split('\n').map(x => x.trim()).filter(x => x);
    let R = rightArea.value.split('\n').map(x => x.trim()).filter(x => x);
    let match = [];
    let no = [];

    L.forEach(l => {
        let found = false;
        for (let r of R) {
            if (isMatch(l, r)) {
                match.push(r);
                found = true;
                break;
            }
        }
        if (!found) no.push(l);
    });

    let finalMatch = [...new Set(match)];
    rightArea.value = finalMatch.join('\n');
    updateRightCount();

    unmatchLeft.textContent = `未匹配：${no.length}人 → ${no.join('、') || '无'}`;
    matchRight.textContent = `匹配成功：${finalMatch.length}人`;

    // 金额统计
    let t = Number(totalMoney.value) || 0;
    let p = Number(perMoney.value) || 0;
    let num = finalMatch.length;
    let realTotal = num * p;

    if (t > 0 || p > 0) {
        moneyResult.textContent =
            `活动人数：${num}人 | 每人发放：${p}金币 | 筹备总金额：${t}金币 | 实际派发：${realTotal}金币`;
    } else {
        moneyResult.textContent = '';
    }
};

// 初始化
updateLeftCount();
updateRightCount();
</script>
</body>
</html>
