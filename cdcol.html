<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>完美世界 完美国际 人物代码调色工具</title>
<!-- 引入公共头部导航样式 -->
    <link rel="stylesheet" href="common/common.css">
<style>
*{box-sizing:border-box;font-family:system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:0;}
body{background:#ebebe7;color:#eee;padding:20px;position:relative;}
/* ======== 100%复制 ys.html 原版外层容器container ======== */
.container {
    max-width: 1000px;
    margin: 30px auto;
    background: #f8f7f4;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    overflow: hidden;
}
.tool-wrap {
    padding:30px;
}
.wrap{max-width:920px;margin:0 auto;}
h2{margin-bottom:16px;font-size:20px;color:#222;}
.container-color{display:flex;gap:16px;flex-wrap:wrap;}
#pickerCanvas{
    width:420px;
    height:420px;
    cursor:crosshair;
    border-radius:8px;
    border:1px solid #444;
}
#hueBar{
    width:40px;
    height:420px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid #444;
}
.right-panel{
    flex:1;
    min-width:280px;
    display:flex;
    flex-direction:column;
    gap:12px;
}
.preview{
    height:120px;
    border-radius:8px;
    border:1px solid #444;
}
.info{
    background:#232332;
    padding:14px;
    border-radius:8px;
}
.line{margin:8px 0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dec-num{font-family:Consolas;font-size:18px;color:#72d7ff;margin:8px 0;}
input{
    background:#2a2a38;
    color:#fff;
    border:1px solid #555;
    border-radius:4px;
    padding:4px 6px;
    font-size:14px;
}
input.rgb-in{width:55px;}
input.hex-in{width:130px;}
button{
    background:#2e7d32;
    color:#fff;
    border:0;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}
button:active{background:#1b5e20;}
.note{margin-top:10px;font-size:12px;color:#999;line-height:1.4;}
</style>
</head>
<body>
<!--公共头部导航占位容器-->
<div id="globalHeaderNav"></div>
<div class="header">人物代码调色工具｜HSV取色 / RGB/HEX转十进制</div>
<!--公共导航JS，提供initNav()-->


<div class="container">
    <div class="tool-wrap">
        <div class="wrap">
            <div class="container-color">
                <canvas id="pickerCanvas" width="420" height="420"></canvas>
                <canvas id="hueBar" width="40" height="420"></canvas>
                <div class="right-panel">
                    <div class="preview" id="colorPreview"></div>
                    <div class="info">
                        <div class="line">
                            <span>RGB:</span>
                            <input class="rgb-in" id="inR" type="number" min="0" max="255" value="255">
                            <input class="rgb-in" id="inG" type="number" min="0" max="255" value="0">
                            <input class="rgb-in" id="inB" type="number" min="0" max="255" value="0">
                        </div>
                        <div class="line">
                            <span>HEX:</span>
                            <input class="hex-in" id="inHex" placeholder="#RRGGBB" value="#FF0000">
                        </div>
                        <div class="line">RGB：<span id="rgbText">255,0,0</span></div>
                        <div class="line">HEX：<span id="hexText">#FF0000</span></div>
                        <div class="dec-num" id="iniDecVal">-65536</div>
                        <button id="copyBtn">复制INI十进制数值</button>
                    </div>
                    <div class="note">
                        1.左侧大方块选饱和度亮度，右侧竖条选色相；白色圆圈为选点标记。<br>
                        2.【支持单击点选 + 按住拖动】，可手动输入 R G B(0‑255) 或 HEX(#RRGGBB)，自动转为游戏INI负十进制。<br>
                        3.复制结果直接填写：colorHair = 数值；ARGB固定完全不透明。<br>
                        浏览器预览与游戏内光照会存在轻微色差。
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('pickerCanvas');
const ctx = canvas.getContext('2d');
const hueCanvas = document.getElementById('hueBar');
const hueCtx = hueCanvas.getContext('2d');
const preview = document.getElementById('colorPreview');
const rgbText = document.getElementById('rgbText');
const hexText = document.getElementById('hexText');
const iniDecVal = document.getElementById('iniDecVal');
const copyBtn = document.getElementById('copyBtn');
const inR = document.getElementById('inR');
const inG = document.getElementById('inG');
const inB = document.getElementById('inB');
const inHex = document.getElementById('inHex');
let hue = 0;
let sat = 1.0;
let val = 0.5;
let dragMain = false;
let dragHue = false;
let lockInputUpdate = false;
//绘制色相竖条
function drawHueBar(){
    const grad = hueCtx.createLinearGradient(0,0,0,hueCanvas.height);
    for(let i=0;i<=360;i+=60){
        grad.addColorStop(i/360,`hsl(${i},100%,50%)`);
    }
    hueCtx.fillStyle = grad;
    hueCtx.fillRect(0,0,hueCanvas.width,hueCanvas.height);
    const posY = (hue/360)*hueCanvas.height;
    hueCtx.strokeStyle="#ffffff";
    hueCtx.lineWidth=2;
    hueCtx.beginPath();
    hueCtx.moveTo(0,posY);
    hueCtx.lineTo(hueCanvas.width,posY);
    hueCtx.stroke();
}
//绘制二维取色面板+选点圆圈标记
function drawMain(){
    ctx.fillStyle = `hsl(${hue},100%,50%)`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const g1 = ctx.createLinearGradient(0,0,canvas.width,0);
    g1.addColorStop(0,"#ffffff");
    g1.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle = g1;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const g2 = ctx.createLinearGradient(0,0,0,canvas.height);
    g2.addColorStop(0,"rgba(0,0,0,0)");
    g2.addColorStop(1,"#000000");
    ctx.fillStyle = g2;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const px = sat * canvas.width;
    const py = (1-val)* canvas.height;
    ctx.beginPath();
    ctx.arc(px,py,8,0,Math.PI*2);
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px,py,3,0,Math.PI*2);
    ctx.fillStyle="#000000";
    ctx.fill();
}
//HSV转RGB
function hsvToRgb(h,s,v){
    let r,g,b;
    let i = Math.floor(h/60);
    let f = h/60 - i;
    let p = v*(1-s);
    let q = v*(1-f*s);
    let t = v*(1-(1-f)*s);
    switch(i%6){
        case 0:r=v;g=t;b=p;break;
        case 1:r=q;g=v;b=p;break;
        case 2:r=p;g=v;b=t;break;
        case 3:r=p;g=q;b=v;break;
        case 4:r=t;g=p;b=v;break;
        case 5:r=v;g=p;b=q;break;
    }
    return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}
//RGB转HSV
function rgbToHsv(r,g,b){
    r/=255;g/=255;b/=255;
    let max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h,s,v=max;
    let d=max-min;
    s = max===0 ? 0 : d/max;
    if(max===min){
        h=0;
    }else{
        switch(max){
            case r:h=((g-b)/d)+(g<b?6:0);break;
            case g:h=((b-r)/d)+2;break;
            case b:h=((r-g)/d)+4;break;
        }
        h*=60;
    }
    return [h,s,v];
}
function rgb2hex(r,g,b){
    return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
}
function hexToRgb(hex){
    let result=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? [
        parseInt(result[1],16),
        parseInt(result[2],16),
        parseInt(result[3],16)
    ] : null;
}
//由 r,g,b 更新全部界面（包含输入框、画布、十进制）
function setByRgb(r,g,b){
    lockInputUpdate=true;
    [hue,sat,val]=rgbToHsv(r,g,b);
    inR.value=r;inG.value=g;inB.value=b;
    inHex.value=rgb2hex(r,g,b);
    updateAllRender(r,g,b);
    setTimeout(()=>lockInputUpdate=false,0);
}
function updateAllRender(r,g,b){
    const hex=rgb2hex(r,g,b);
    preview.style.background=`rgb(${r},${g},${b})`;
    rgbText.textContent=`${r},${g},${b}`;
    hexText.textContent=hex;
    let argb=(0xFF<<24)|(r<<16)|(g<<8)|b;
    let signed=argb|0;
    iniDecVal.textContent=signed;
    drawMain();
    drawHueBar();
}
//从画布hsv更新
function updateAllFromHsv(){
    const [r,g,b]=hsvToRgb(hue,sat,val);
    lockInputUpdate=true;
    inR.value=r;inG.value=g;inB.value=b;
    inHex.value=rgb2hex(r,g,b);
    setTimeout(()=>lockInputUpdate=false,0);
    updateAllRender(r,g,b);
}
// 通用：处理pickerCanvas坐标
function handlePickerPos(e){
    const rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    x = Math.max(0,Math.min(canvas.width,x));
    y = Math.max(0,Math.min(canvas.height,y));
    sat = x / canvas.width;
    val = 1 - (y / canvas.height);
    updateAllFromHsv();
}
// 通用：处理hueBar坐标
function handleHuePos(e){
    const rect = hueCanvas.getBoundingClientRect();
    let y = e.clientY - rect.top;
    y = Math.max(0,Math.min(hueCanvas.height,y));
    hue = 360 * (y / hueCanvas.height);
    updateAllFromHsv();
}
// ========== 【修改：同时支持单击 + 按住拖动】 ==========
// 主画布：按下开启拖动
canvas.addEventListener('mousedown',e=>{
    dragMain = true;
    handlePickerPos(e);
});
// 单击直接取色
canvas.addEventListener('click',e=>{
    handlePickerPos(e);
});
// 全局松开，关闭拖动
window.addEventListener('mouseup',()=>{
    dragMain = false;
    dragHue = false;
});
// 拖动时更新
canvas.addEventListener('mousemove',e=>{
    if(!dragMain) return;
    handlePickerPos(e);
});
//色相条：按下开启拖动
hueCanvas.addEventListener('mousedown',e=>{
    dragHue = true;
    handleHuePos(e);
});
//色相条单击
hueCanvas.addEventListener('click',e=>{
    handleHuePos(e);
});
hueCanvas.addEventListener('mousemove',e=>{
    if(!dragHue) return;
    handleHuePos(e);
});
//输入框事件
[inR,inG,inB].forEach(el=>{
    el.addEventListener('input',()=>{
        if(lockInputUpdate) return;
        let r=Number(inR.value)||0;
        let g=Number(inG.value)||0;
        let b=Number(inB.value)||0;
        r=Math.max(0,Math.min(255,r));
        g=Math.max(0,Math.min(255,g));
        b=Math.max(0,Math.min(255,b));
        setByRgb(r,g,b);
    })
})
inHex.addEventListener('input',()=>{
    if(lockInputUpdate) return;
    const rgb=hexToRgb(inHex.value.trim());
    if(rgb){
        setByRgb(rgb[0],rgb[1],rgb[2]);
    }
})
copyBtn.onclick = async ()=>{
    const num = iniDecVal.textContent.trim();
    await navigator.clipboard.writeText(num);
    alert("已复制INI颜色值："+num);
};
//初始化
drawHueBar();
drawMain();
updateAllFromHsv();
</script>
    <script src="common/nav.js"></script>
<script>
(async function loadGlobalComponent(){
    try{
        const res = await fetch('common/header-nav.html');
        if(!res.ok) throw new Error("加载失败");
        const html = await res.text();
        document.querySelector('#globalHeaderNav').innerHTML = html;
        initNav();
        document.body.classList.add("ready");
    }catch(err){
        console.error(err);
        document.body.classList.add("ready");
    }
})();
</script>
</body>
</html>
