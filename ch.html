    <style>

        }
        body {
            background-color: #ebebe7;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            background: #f8f7f4;
            border-radius: 12px;

        .header {

            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;

        }
        .header-main {
            font-size: 24px;
            font-weight: bold;
        }
        .filter-bar {
            padding: 18px 24px;
            background-color: #f1efe9;
            border-bottom: 1px solid #e0ded7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;

            font-size: 16px;
            margin-right: 8px;
            color: #5c5c5c;
            font-weight: 500;
        }
        .filter-bar select,

            padding: 8px 16px;
            font-size: 15px;

            border-radius: 6px;
            outline: none;
            transition: all 0.2s;

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #91aecf;
            box-shadow: 0 0 0 2px rgba(145,174,207,0.15);
        }
        .table-wrapper {
            padding: 24px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8f7f4;
            border-radius: 8px;
            overflow: hidden;
            table-layout: auto;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            font-size: 14px;
            vertical-align: middle;
            white-space: nowrap;
        }

            background: transparent;
            border-bottom: 1px solid #e8e6e0;
            transition: background-color 0.2s ease;
        }

        td:last-child {
            white-space: normal !important;
            width: 9999px;
        }

        tr:hover {
            background-color: #e6eaf1 !important;

        }
        .attr-box {
            background: transparent !important;
            line-height: 1.6;

        .attr-wugong { color: #c95d56; }
        .attr-fagong { color: #9359b5; }
        .attr-wufang  { color: #4b8ac9; }
        .attr-fafang { color: #59886b; }

        .attr-suiji { color: #b25978; }
        .attr-dengji { color: #9359b5; }
        .attr-huifu { color: #59886b; }

            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .coord:hover, .copy-title:hover {
            color: #b66464;
        }
        .hidden {
            display: none !important;
        }
        #empty-tip {

            color: #a8a59e;
            font-size: 16px;

        .copy-tip {

            left: 50%;
            transform: translateX(-50%);
            background: #96b886;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;

        .float-menu {

            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 999;
            width: 220px;
            transition: all 0.3s ease;
        }
        .float-menu.collapsed {
            transform: translateY(-50%) translateX(calc(100% - 25px));
        }
        .menu-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);

            height: 60px;

            background: linear-gradient(135deg, #91aecf, #aabfdf);
            color: #fff;
            font-weight: bold;
            border-left: 4px solid #fff;

            { category: "挑战", list: [ { attr: "物防+8<br>攻等+1<br>真气+4", task: "熔岩之王", title: "熔岩之王", process: "传送到洒火村，按顺序击杀怪物完成任务" }, { attr: "法防+6<br>罡气+5<br>物穿+2<br>坚韧+1", task: "冰雪之王", title: "冰雪之王", process: "传送到碎冰村，按顺序击杀怪物完成任务" } ] },
            { category: "军衔", list: [ { attr: "生命+10<br>攻等+4<br>防等+4<br>真气+10", task: "二级军衔", title: "突击队长", process: "声望1000点，幽兰谷击杀15反戈蜴完成任务" }, { attr: "生命+10<br>攻等+4<br>防等+4<br>真气+10", task: "四级军衔", title: "疾行先锋", process: "声望5000点，云梦村击杀15啮甲冥鼠完成任务" } ] }
        ];

        const categoryColors = [ "#fef0f0", "#f0f7fe", "#f0fff4", "#fff8e8", "#f5f0ff", "#fff0f6", "#f0fcff", "#f8f0e8" ];
        const select = document.getElementById('category-select');
        const searchInput = document.getElementById('search-input');
        const emptyTip = document.getElementById('empty-tip');
        const dataTable = document.getElementById('data-table');
        const tableBody = document.getElementById('table-body');
        const thCategory = document.getElementById('th-category');
        const copyTip = document.getElementById('copyTip');

        select.addEventListener('change', renderTable);
        searchInput.addEventListener('input', renderTable);
        window.addEventListener('load', renderTable);

        function renderTable() {
            const category = select.value;
            const keyword = searchInput.value.trim().toLowerCase();
            tableBody.innerHTML = '';
            let filteredList = [];

            if (category === 'all' && !keyword) {
                data.forEach(cate => { cate.list.forEach(item => { filteredList.push({ ...item, category: cate.category }); }); });
            } else {
                let allItems = [];
                data.forEach(cate => { cate.list.forEach(item => { allItems.push({ ...item, category: cate.category }); }); });
                filteredList = allItems.filter(item => {
                    const matchCate = category === 'all' || item.category === category;
                    const matchSearch = !keyword || (item.title && item.title.toLowerCase().includes(keyword));
                    return matchCate && matchSearch;
                });
            }

            if (filteredList.length === 0) { emptyTip.classList.remove('hidden'); dataTable.classList.add('hidden'); return; }
            emptyTip.classList.add('hidden'); dataTable.classList.remove('hidden');
            thCategory.classList.toggle('hidden', category !== 'all');
            category === 'all' && !keyword ? renderMergedTable(filteredList) : renderNormalTable(filteredList, category);
            bindCopyEvents();
        }

        function renderMergedTable(list) {
            const groups = {}; list.forEach(item => { if (!groups[item.category]) groups[item.category] = []; groups[item.category].push(item); });
            const cateKeys = Object.keys(groups); let globalRowIndex = 0;
            cateKeys.forEach((cate, idx) => {
                const items = groups[cate]; const baseColor = categoryColors[idx % categoryColors.length];
                items.forEach((item, itemIdx) => {
                    const tr = document.createElement('tr');
                    const isEvenRow = globalRowIndex % 2 === 0;
                    const finalBg = isEvenRow ? baseColor : `color-mix(in srgb, ${baseColor} 85%, #dcd9d0)`;
                    tr.style.backgroundColor = finalBg;
                    const titleHtml = item.title === '无' ? '无' : `<span class="copy-title">${item.title}</span>`;
                    const attrHtml = renderAttrHtml(item.attr);
                    let cateTd = '';
                    if (itemIdx === 0) cateTd = `<td rowspan="${items.length}" style="vertical-align:middle; font-weight:bold; color:#2d2d2d; background:${baseColor}">${cate}</td>`;
                    tr.innerHTML = `${cateTd}<td>${item.task}</td><td>${titleHtml}</td><td class="attr-box">${attrHtml}</td><td>${item.process}</td>`;
                    tableBody.appendChild(tr); globalRowIndex++;
                });
            });
        }

        function renderNormalTable(list, category) {
            list.forEach((item, index) => {
                const tr = document.createElement('tr');
                if (index % 2 === 1) tr.style.backgroundColor = '#f3f1ec';
                const titleHtml = item.title === '无' ? '无' : `<span class="copy-title">${item.title}</span>`;
                const attrHtml = renderAttrHtml(item.attr);
                tr.innerHTML = `${category === 'all' ? `<td>${item.category}</td>` : ''}<td>${item.task}</td><td>${titleHtml}</td><td class="attr-box">${attrHtml}</td><td>${item.process}</td>`;
                tableBody.appendChild(tr);
            });
        }

        function renderAttrHtml(attrStr) {
            if (!attrStr || attrStr === '无') return '无';
            return attrStr
                .replace(/物攻\+(\d+)/g, '<span class="attr-wugong">物攻+$1</span>')
                .replace(/法攻\+(\d+)/g, '<span class="attr-fagong">法攻+$1</span>')
                .replace(/物防\+(\d+)/g, '<span class="attr-wufang">物防+$1</span>')
                .replace(/法防\+(\d+)/g, '<span class="attr-fafang">法防+$1</span>')
                .replace(/生命\+(\d+)/g, '<span class="attr-shengming">生命+$1</span>')
                .replace(/真气\+(\d+)/g, '<span class="attr-zhenqi">真气+$1</span>')
                .replace(/坚韧\+(\d+)/g, '<span class="attr-jianren">坚韧+$1</span>')
                .replace(/[法物]穿\+(\d+)/g, '<span class="attr-chuan">$&</span>')
                .replace(/罡气\+(\d+)/g, '<span class="attr-gangqi">罡气+$1</span>')
                .replace(/碎骨\+(\d+)/g, '<span class="attr-suiji">碎骨+$1</span>')
                .replace(/[攻防]等\+(\d+)/g, '<span class="attr-dengji">$&</span>')
                .replace(/(生命|真气)恢复\+(\d+)/g, '<span class="attr-huifu">$1恢复+$2</span>')
                .replace(/速度\+(\d+)/g, '<span class="attr-other">速度+$1</span>');
        }

        function copyText(text) {
            if (!text || text === '无') return;
            navigator.clipboard.writeText(text).then(showCopyTip).catch(() => {
                const input = document.createElement('input'); input.value = text; document.body.appendChild(input); input.select(); document.execCommand('copy'); document.body.removeChild(input); showCopyTip();
            });
        }

        function showCopyTip() {
            copyTip.classList.add('show'); setTimeout(() => copyTip.classList.remove('show'), 1500);
        }

        function bindCopyEvents() {
            document.querySelectorAll('.coord,.copy-title').forEach(el => {
                el.onclick = () => copyText(el.innerText.trim().replace(/[()]/g, ''));
            });
        }
    </script>
