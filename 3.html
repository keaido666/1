    <script>
      document.addEventListener('DOMContentLoaded', function() {
            // 获取所有按钮和图片容器
            const buttons = document.querySelectorAll('.image-but');
            const containers = document.querySelectorAll('.images-container2');
            
            // 为每个按钮添加点击事件
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const targetContainer = document.getElementById(targetId);
                    
                    // 如果当前图片已显示，则隐藏
                    if (this.classList.contains('active')) {
                        targetContainer.style.display = 'none';
                        this.classList.remove('active');
                        return;
                    }
                    
                    // 隐藏所有图片和取消所有按钮激活状态
                    containers.forEach(container => {
                        container.style.display = 'none';
                    });
                    buttons.forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    // 显示当前图片并激活按钮
                    targetContainer.style.display = 'block';
                    this.classList.add('active');
                });
            });
            
            // 为每个图片容器添加点击事件（点击图片隐藏）
            containers.forEach(container => {
                container.addEventListener('click', function() {
                    this.style.display = 'none';
                    const targetId = this.id;
                    
                    // 找到对应的按钮并取消激活状态
                    buttons.forEach(button => {
                        if (button.getAttribute('data-target') === targetId) {
                            button.classList.remove('active');
                        }
                    });
                });
            });
        });
        
        // 音乐控制功能
        const music = document.getElementById('bg-music');
        const musicIcon = document.getElementById('music-icon');
        const musicText = document.getElementById('music-text');
        
        // 尝试播放音乐（可能被浏览器阻止）
        function tryPlayMusic() {
            music.volume = 0.5; // 设置音量（0-1）
            const promise = music.play();
            
            if (promise !== undefined) {
                promise.then(_ => {
                    // 自动播放成功
                    music.muted = false;
                    updateMusicUI();
                }).catch(error => {
                    // 自动播放被阻止
                    console.log('自动播放被阻止，需要用户交互');
                    music.muted = true;
                    updateMusicUI();
                });
            }
        }
        
        // 更新音乐控制UI
        function updateMusicUI() {
            if (music.muted) {
                musicIcon.className = 'fas fa-volume-mute';
                musicText.textContent = '开启音乐';
            } else {
                musicIcon.className = 'fas fa-volume-up';
                musicText.textContent = '关闭音乐';
            }
        }
        
        // 切换音乐状态
        function toggleMusic() {
            music.muted = !music.muted;
            if (!music.muted && music.paused) {
                music.play();
            }
            updateMusicUI();
        }
        
        // 页面加载后尝试播放音乐
        window.addEventListener('DOMContentLoaded', () => {
            tryPlayMusic();
        });
        
        // 点击页面任意位置尝试播放音乐（解决自动播放限制）
        document.addEventListener('click', function() {
            if (music.paused) {
                music.play();
            }
            // 只执行一次
            document.removeEventListener('click', arguments.callee);
        });
      
      //计算税额 获取DOM元素
        const excludingTaxInput = document.getElementById('excludingTax');
        const includingTaxInput = document.getElementById('includingTax');
        const taxAmountElement = document.getElementById('taxAmount');
        const swapButton = document.getElementById('swapButton');
        const resetButton = document.getElementById('resetButton');
        const copyButton = document.getElementById('copyButton');
        const priceContainer = document.getElementById('priceContainer');
        const historyContainer = document.getElementById('historyContainer');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        
        // 税率
        const TAX_RATE = 0.08;
        // 计算历史记录
        let calculationHistory = [];
        
        // 显示通知
        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.remove('translate-y-20', 'opacity-0');
            notification.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                notification.classList.remove('translate-y-0', 'opacity-100');
                notification.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }
        
        // 格式化金额为两位小数
        function formatCurrency(amount) {
            return '¥' + parseFloat(amount).toFixed(2);
        }
        
        // 从不含税价格计算含税价格
        function calculateIncludingTax(excludingTax) {
            const tax = excludingTax * TAX_RATE;
            const includingTax = excludingTax + tax;
            return { includingTax, tax };
        }
        
        // 从含税价格计算不含税价格
        function calculateExcludingTax(includingTax) {
            const excludingTax = includingTax / (1 + TAX_RATE);
            const tax = includingTax - excludingTax;
            return { excludingTax, tax };
        }
        
        // 更新税额显示
        function updateTaxDisplay(tax) {
            taxAmountElement.textContent = formatCurrency(tax);
            taxAmountElement.classList.add('value-animation');
            setTimeout(() => {
                taxAmountElement.classList.remove('value-animation');
            }, 400);
        }
        
        // 添加到计算历史
        function addToHistory(including, excluding, tax) {
            const date = new Date();
            const timeString = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            
            const historyItem = {
                including: formatCurrency(including),
                excluding: formatCurrency(excluding),
                tax: formatCurrency(tax),
                time: timeString
            };
            
            calculationHistory.unshift(historyItem);
            // 限制历史记录数量
            if (calculationHistory.length > 5) {
                calculationHistory.pop();
            }
            
            renderHistory();
        }
        
        // 渲染历史记录
        function renderHistory() {
            if (calculationHistory.length === 0) {
                historyContainer.innerHTML = '<p class="text-gray-500 italic text-center text-sm">暂无计算记录</p>';
                return;
            }
            
            historyContainer.innerHTML = '';
            calculationHistory.forEach(item => {
                const historyElement = document.createElement('div');
                historyElement.className = 'p-2.5 bg-neutral rounded-lg border border-gray-100';
                historyElement.innerHTML = `
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span>${item.time}</span>
                        <span class="text-accent">税: ${item.tax}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-primary">${item.including}</span>
                        <span class="text-secondary">${item.excluding}</span>
                    </div>
                `;
                historyContainer.appendChild(historyElement);
            });
        }
        
        // 当含税价格变化时
        includingTaxInput.addEventListener('input', function() {
            const value = parseFloat(this.value) || 0;
            if (!isNaN(value) && value >= 0) {
                const { excludingTax, tax } = calculateExcludingTax(value);
                // 防止循环触发
                excludingTaxInput.removeEventListener('input', excludingTaxInputHandler);
                excludingTaxInput.value = excludingTax.toFixed(2);
                excludingTaxInput.addEventListener('input', excludingTaxInputHandler);
                
                updateTaxDisplay(tax);
                this.classList.add('border-primary/70');
                
                // 添加到历史记录
                if (value > 0) {
                    addToHistory(value, excludingTax, tax);
                }
                
                setTimeout(() => {
                    this.classList.remove('border-primary/70');
                }, 300);
            }
        });
        
        // 当不含税价格变化时
        function excludingTaxInputHandler() {
            const value = parseFloat(this.value) || 0;
            if (!isNaN(value) && value >= 0) {
                const { includingTax, tax } = calculateIncludingTax(value);
                // 防止循环触发
                includingTaxInput.removeEventListener('input', includingTaxInputHandler);
                includingTaxInput.value = includingTax.toFixed(2);
                includingTaxInput.addEventListener('input', includingTaxInputHandler);
                
                updateTaxDisplay(tax);
                this.classList.add('border-secondary/70');
                
                // 添加到历史记录
                if (value > 0) {
                    addToHistory(includingTax, value, tax);
                }
                
                setTimeout(() => {
                    this.classList.remove('border-secondary/70');
                }, 300);
            }
        }
        
        // 保存事件处理函数引用，便于移除和重新添加
        const includingTaxInputHandler = includingTaxInput.oninput;
        excludingTaxInput.addEventListener('input', excludingTaxInputHandler);
        
        // 交换按钮 - 交换两个输入框的位置和值
        swapButton.addEventListener('click', function() {
            // 添加交换动画
            this.classList.add('swap-animation');
            setTimeout(() => {
                this.classList.remove('swap-animation');
            }, 600);
            
            // 获取两个价格输入组
            const inputGroups = priceContainer.querySelectorAll('.price-input-group');
            const firstGroup = inputGroups[0];
            const secondGroup = inputGroups[1];
            
            // 交换DOM位置
            priceContainer.insertBefore(secondGroup, firstGroup);
            
            // 交换值
            const tempValue = includingTaxInput.value;
            includingTaxInput.value = excludingTaxInput.value;
            excludingTaxInput.value = tempValue;
            
            // 触发计算（如果有值）
            if (includingTaxInput.value) {
                includingTaxInput.dispatchEvent(new Event('input'));
            } else if (excludingTaxInput.value) {
                excludingTaxInput.dispatchEvent(new Event('input'));
            }
            
            showNotification('已交换价格位置');
        });
        
        // 重置按钮
        resetButton.addEventListener('click', function() {
            // 添加按钮点击动画
            this.classList.add('bg-gray-200');
            setTimeout(() => {
                this.classList.remove('bg-gray-200');
            }, 200);
            
            // 清空输入
            includingTaxInput.value = '';
            excludingTaxInput.value = '';
            taxAmountElement.textContent = '¥0.00';
            
            showNotification('已重置计算');
        });
        
        // 复制结果按钮
        copyButton.addEventListener('click', function() {
            const including = includingTaxInput.value ? `含税价格: ¥${includingTaxInput.value}` : '';
            const excluding = excludingTaxInput.value ? `不含税价格: ¥${excludingTaxInput.value}` : '';
            const tax = taxAmountElement.textContent !== '¥0.00' ? `税额: ${taxAmountElement.textContent}` : '';
            
            if (including || excluding || tax) {
                const textToCopy = [including, excluding, tax].filter(item => item).join('\n');
                navigator.clipboard.writeText(textToCopy).then(() => {
                    // 按钮动画
                    this.classList.add('bg-green-600');
                    setTimeout(() => {
                        this.classList.remove('bg-green-600');
                    }, 300);
                    
                    showNotification('计算结果已复制');
                });
            } else {
                showNotification('没有可复制的结果');
            }
        });
        
        // 添加输入框获取焦点时的效果
        [excludingTaxInput, includingTaxInput].forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('ring-1', 'ring-primary/20');
                this.classList.add('bg-white');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('ring-1', 'ring-primary/20');
                if (!this.value) {
                    this.classList.remove('bg-white');
                }
            });
        });
        
        // 初始化历史记录
        renderHistory();
    </script>
</body>
</html>
